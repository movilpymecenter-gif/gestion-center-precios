name: Actualizar precios Gestión Center Cloud

on:
  schedule:
    # Lunes 09:00 Argentina (12:00 UTC)
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Comparar precios
        run: python actualizar_precios.py

      - name: Publicar cambios si existen
        shell: bash
        run: |
          if git diff --quiet -- precios.json; then
            echo 'No hay cambios para publicar.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add precios.json
          git commit -m 'Actualizar precios de Gestión Center Cloud'
          git push
